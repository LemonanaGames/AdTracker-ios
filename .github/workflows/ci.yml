name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.47.9"

jobs:
  test:
    name: Analyze, test, validate content
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - name: Check generated code is up to date
        run: |
          dart run build_runner build --delete-conflicting-outputs
          flutter gen-l10n
          git diff --exit-code -- lib
      - name: Format check (generated code excluded)
        run: dart format --line-length 120 --output=none --set-exit-if-changed $(find lib test tool -name '*.dart' ! -name '*.g.dart' ! -path 'lib/app/l10n/*')
      - run: flutter analyze
      - run: flutter test
      - run: dart run tool/validate_content.dart
      - name: Balance smoke (15 lives × 60 min)
        run: dart run tool/simulate_lives.dart 15 60

  ios-build:
    name: iOS build (no codesign)
    runs-on: macos-latest
    needs: test
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - run: flutter build ios --release --no-codesign
